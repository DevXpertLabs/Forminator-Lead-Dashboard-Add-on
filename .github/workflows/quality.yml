name: Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: php -l on all PHP files
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    name: PHPCS (WordPress standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer
      - name: Install PHPCS + WordPress standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer:"^3.9" \
            wp-coding-standards/wpcs:"^3.1" \
            phpcompatibility/phpcompatibility-wp:"^2.1" \
            dealerdirect/phpcodesniffer-composer-installer:"^1.0"
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"
      - name: Run PHPCS
        run: phpcs -q --report=full

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '.'

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli
          coverage: none
          tools: composer
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest
      - name: Run PHPUnit
        run: composer test
